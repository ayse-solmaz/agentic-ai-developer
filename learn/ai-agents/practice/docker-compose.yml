# Day 40 — production-shaped Compose: API service + optional labs on host
services:
  yoyo-api:
    build: .
    image: yoyo-api:day40
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      YOYO_API_KEY: ${YOYO_API_KEY:-yoyo-lab-key}
      YOYO_RATE_LIMIT: ${YOYO_RATE_LIMIT:-30}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
